[project]
name = "dovexscrape"
version = "0.20.1"
authors = [{ name = "doveppp", email = "panzhiyidd@gmail.com" }]
description = "Twitter GraphQL and Search API implementation with SNScrape data models"
readme = "readme.md"
requires-python = ">=3.10"
keywords = ["twitter", "scrape", "scrapper", "api", "snscrape"]
license = { text = "MIT" }
classifiers = [
  'Development Status :: 4 - Beta',
  'License :: OSI Approved :: MIT License',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
]
dependencies = [
  "aiolimiter>=1.2",
  "asyncmy>=0.2.9",
  # MySQL 8 default auth (caching_sha2_password) over a plaintext connection
  "cryptography>=42.0.0",
  "fake-useragent>=1.4.0",
  "httpx>=0.26.0",
  "loguru>=0.7.0",
  "pyotp>=2.9.0",
  "beautifulsoup4>=4.13.0",
  "py-machineid>=1.0.0",
]

[project.optional-dependencies]
curl = ["curl-cffi>=0.7.0"]

[dependency-groups]
dev = [
  "curl-cffi>=0.7.0",
  "pytest-asyncio>=0.23.3",
  "pytest-cov>=4.1.0",
  "pytest-httpx>=0.28.0",
  "pytest>=7.4.4",
  "rich>=13.0",
  "ruff>=0.1.11",
  "ty>=0.0.41",
]

[project.urls]
repository = "https://github.com/doveppp/dovexscrape"

[project.scripts]
dovexscrape = "dovexscrape.cli:run"

[build-system]
requires = ["hatchling>=1.9.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dovexscrape"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# the connection pool is a per-process singleton, so tests and fixtures must share one loop
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "SIM"]
ignore = ["E501", "UP035", "SIM105"]

[tool.ty.environment]
python-version = "3.10"
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"
missing-type-argument = "ignore"
missing-override-decorator = "ignore"
